# ClaimIQ Enterprise — gateway.
#
# Single entry point: static assets, media, the SPA and the API.

upstream claimiq_backend {
    server backend:8000;
    keepalive 32;
}

upstream claimiq_frontend {
    server frontend:80;
    keepalive 16;
}

# Rate limiting. Sized for a LAN deployment with tens of concurrent users, not
# for public internet exposure.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Uploads are streamed to the backend rather than buffered here. Contract
    # sets run to hundreds of megabytes and buffering them would put the whole
    # file in nginx's memory or spool directory first.
    client_max_body_size 512m;
    client_body_timeout 300s;
    proxy_request_buffering off;

    # Never advertise the server version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # The SPA loads no third-party resources; an air-gapped deployment cannot
    # reach any external origin, so the policy can be this strict.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://claimiq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # AI generation and large ingests legitimately take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Server-sent events for job progress must not be buffered.
        proxy_buffering off;
    }

    location ~ ^/api/v1/(documents|imports)/.*/upload {
        limit_req zone=upload_limit burst=10 nodelay;

        proxy_pass http://claimiq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }

    location /django-admin/ {
        proxy_pass http://claimiq_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media is served through the backend, never directly: uploaded documents
    # are project-scoped and must pass a permission check. Exposing this volume
    # as a static alias would make every uploaded contract public to anyone who
    # can guess a path.
    location /media/ {
        internal;
        alias /srv/media/;
    }

    location / {
        proxy_pass http://claimiq_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
