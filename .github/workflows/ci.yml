name: CI

# ClaimIQ Enterprise is now its own repository, so this workflow lives at the
# repository root where GitHub Actions discovers it, and every path is
# root-relative. It previously sat inside a nested directory with a
# `working-directory` prefix on every step; that prefix is gone.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # The fast gate. Pure Python, no services, no database — this should fail
  # first when something is wrong, and it takes under two seconds.
  domain-tests:
    name: Domain tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest pytest-cov
      - run: pytest tests/domain -q --cov=claimiq --cov-report=term-missing

  # Guards ADR 0001: the domain layer must stay importable on 3.9. If a domain
  # module gains a Django import or 3.10+ syntax this fails, which is what
  # makes the layering rule self-policing rather than a review convention.
  domain-python39:
    name: Domain layer runs on Python 3.9
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest
      - run: pytest tests/domain -q

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until annotation coverage is complete
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: mypy claimiq config

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: claimiq_test
          POSTGRES_USER: claimiq
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimiq"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: claimiq_test
      POSTGRES_USER: claimiq
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1 poppler-utils
      - run: pip install -r requirements-dev.txt
      - name: Enable extensions
        # Also in template1, because Django builds its test database from it
        # and every vector column would otherwise fail with "type vector does
        # not exist".
        run: |
          for db in claimiq_test template1; do
            PGPASSWORD=ci-only-password psql -h localhost -U claimiq -d "$db" \
              -c "CREATE EXTENSION IF NOT EXISTS vector;
                  CREATE EXTENSION IF NOT EXISTS pg_trgm;
                  CREATE EXTENSION IF NOT EXISTS unaccent;"
          done
        working-directory: .
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Validate reference data
        run: python manage.py seed_reference_data --check-only
      - name: Run full suite
        run: pytest tests/ -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit bandit
      - name: Dependency audit
        working-directory: backend
        run: pip-audit -r requirements.txt || true
      - name: Static security scan
        working-directory: backend
        run: bandit -r claimiq config -ll -x tests
      - name: Fail if a real secret was committed
        # .env.example is a template with empty values and is expected.
        run: |
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "A .env file is tracked. Secrets must never be committed."
            exit 1
          fi

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [domain-tests, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend (CPU profile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          build-args: HARDWARE_PROFILE=cpu
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-validate:
    name: Compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          DJANGO_SECRET_KEY: validate-only
          POSTGRES_PASSWORD: validate-only
        run: docker compose config --quiet
