name: ClaimIQ Enterprise CI

# Scoped to this directory so the legacy prototype at the repository root is
# never built or tested by this pipeline.
#
# NOTE ON LOCATION. GitHub Actions only discovers workflows in `.github/
# workflows/` at the *repository* root. This file lives under
# `claimiq-enterprise/` deliberately, to keep the new application fully
# self-contained and avoid adding anything to the shared repository root while
# the legacy prototype lives there. To activate it, either copy this file to
# `<repo-root>/.github/workflows/claimiq-enterprise-ci.yml`, or split
# `claimiq-enterprise/` into its own repository — at which point the paths
# below become root-relative and the `working-directory` prefixes can be
# dropped. Until then this pipeline is defined but not running.
on:
  push:
    paths: ["claimiq-enterprise/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["claimiq-enterprise/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: claimiq-enterprise

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # The fast gate. Pure Python, no services, no database — this is the job that
  # should fail first when something is wrong, and it takes seconds.
  domain-tests:
    name: Domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest pytest-cov
      - name: Run domain suite
        working-directory: claimiq-enterprise/backend
        run: pytest tests/domain -q --cov=claimiq --cov-report=term-missing

  # Guards ADR 0001: the domain layer must remain importable on 3.9. If a
  # domain module gains a Django import or 3.10+ syntax, this fails — which is
  # what makes the layering rule self-policing rather than a review convention.
  domain-python39:
    name: Domain layer runs on Python 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest
      - working-directory: claimiq-enterprise/backend
        run: pytest tests/domain -q

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - working-directory: claimiq-enterprise/backend
        run: |
          ruff check .
          ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory until annotation coverage is complete
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - working-directory: claimiq-enterprise/backend
        run: |
          pip install -r requirements-dev.txt
          mypy claimiq config

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: claimiq_test
          POSTGRES_USER: claimiq
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimiq"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: claimiq_test
      POSTGRES_USER: claimiq
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1 poppler-utils
      - working-directory: claimiq-enterprise/backend
        run: pip install -r requirements-dev.txt
      - name: Enable pgvector
        run: |
          PGPASSWORD=ci-only-password psql -h localhost -U claimiq -d claimiq_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"
      - name: Check for missing migrations
        working-directory: claimiq-enterprise/backend
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate
        working-directory: claimiq-enterprise/backend
        run: python manage.py migrate --noinput
      - name: Run full suite
        working-directory: claimiq-enterprise/backend
        run: pytest tests/ -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: claimiq-enterprise/frontend/package-lock.json
      - working-directory: claimiq-enterprise/frontend
        run: npm ci
      - working-directory: claimiq-enterprise/frontend
        run: npm run lint
      - working-directory: claimiq-enterprise/frontend
        run: npm run test -- --run
      - working-directory: claimiq-enterprise/frontend
        run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit bandit
      - name: Dependency audit
        working-directory: claimiq-enterprise/backend
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-none || true
      - name: Static security scan
        working-directory: claimiq-enterprise/backend
        run: bandit -r claimiq config -ll -x tests
      - name: Fail if a real secret was committed
        run: |
          # .env.example is a template with empty values and is expected.
          if git ls-files 'claimiq-enterprise/**/.env' | grep -q .; then
            echo "A .env file is tracked. Secrets must never be committed."
            exit 1
          fi

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [domain-tests, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend (CPU profile)
        uses: docker/build-push-action@v6
        with:
          context: claimiq-enterprise
          file: claimiq-enterprise/docker/backend.Dockerfile
          build-args: HARDWARE_PROFILE=cpu
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: claimiq-enterprise
          file: claimiq-enterprise/docker/frontend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-validate:
    name: Compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          DJANGO_SECRET_KEY: validate-only
          POSTGRES_PASSWORD: validate-only
        run: docker compose config --quiet
